name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build PCCorner app
        shell: cmd
        run: cl /nologo /O2 /MD src\main.c src\overlay.c src\system_info.c src\resources.rc /link user32.lib gdi32.lib comctl32.lib dxgi.lib d3d11.lib /OUT:PCCorner.exe

      - name: Build injector
        shell: cmd
        run: cl /nologo /O2 injector\injector.c /link kernel32.lib /OUT:injector.exe

      - name: Build present hook DLL
        shell: cmd
        run: cl /nologo /LD /O2 injector\present_hook.c /link d3d11.lib /OUT:present_hook.dll

      - name: Setup NSIS
        uses: repolevedavaj/install-nsis@v1.0.2

      - name: Build installer
        shell: cmd
        run: makensis installer.nsi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pccorner-windows
          path: |
            PCCorner.exe
            injector.exe
            present_hook.dll
            PCCorner-Installer.exe

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.run_number }}
          name: Automated build ${{ github.run_number }}
          files: |
            PCCorner.exe
            injector.exe
            present_hook.dll
            PCCorner-Installer.exe
