name: CI Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Dev Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build PCCorner.exe
        shell: cmd
        run: |
          cl /nologo /W4 /O2 /MD src\main.c src\overlay.c src\system_info.c src\resources.rc /link user32.lib gdi32.lib comctl32.lib dxgi.lib d3d11.lib /OUT:PCCorner.exe

      - name: Build injector.exe
        shell: cmd
        run: |
          cl /nologo /W4 /O2 injector\injector.c /link kernel32.lib /OUT:injector.exe

      - name: Build present_hook.dll
        shell: cmd
        run: |
          cl /nologo /W4 /LD /O2 injector\present_hook.c /link d3d11.lib /OUT:present_hook.dll

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-corner-windows-binaries
          path: |
            PCCorner.exe
            injector.exe
            present_hook.dll
