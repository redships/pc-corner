name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure Copilot model fallback variables are available
        run: |
          echo "COPILOT_AGENT_MODEL=sweagent-capi:gpt-5.3-codex" >> "$GITHUB_ENV"
          echo "COPILOT_FALLBACK_MODEL=sweagent-capi:gpt-5.3-codex" >> "$GITHUB_ENV"
          if [ -n "${GITHUB_COPILOT_API_TOKEN:-}" ] && [ -z "${GITHUB_COPILOT_INFERENCE_TOKEN:-}" ]; then
            echo "GITHUB_COPILOT_INFERENCE_TOKEN=${GITHUB_COPILOT_API_TOKEN}" >> "$GITHUB_ENV"
          fi
